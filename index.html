<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Least Resistance Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background-color: #070b12;
      /* Subtle deep radial glow matching the cyan/blue circuit palette */
      background-image: radial-gradient(
        circle at 50% 48%,
        rgba(0, 174, 255, 0.08) 0%,
        rgba(7, 11, 18, 0.95) 55%,
        #05080d 100%
      );
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 900px;
      width: 100%;
    }

    .logo {
      width: 100%;
      max-width: 680px;
      height: auto;
      display: block;
      /* Soft ambient cyan glow behind the transparent PNG */
      filter: drop-shadow(0 0 24px rgba(0, 195, 255, 0.16));
      user-select: none;
    }

    .slogan {
      /* Pulled up tightly against the bottom of the logo (compensating for transparent image padding) */
      margin-top: -1.15rem;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: clamp(1.05rem, 2.3vw, 1.45rem);
      font-weight: 500;
      letter-spacing: 0.03em;
      color: #94a3b8;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      line-height: 1.4;
    }

    .slogan span {
      background: linear-gradient(90deg, #e2e8f0 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (max-width: 600px) {
      .slogan {
        margin-top: -0.55rem;
      }
    }
  </style>
</head>
<body>
  <main class="hero-container">
    <img
      src="./lrl_logo.png"
      alt="Least Resistance Labs"
      class="logo"
    />
    <p class="slogan">
      <span>“Put down that Excel sheet, Grandma…”</span>
    </p>
  </main>
</body>
</html>
